on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Languages Only embed
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          
          base: "" 
          
          config_timezone: Europe/Paris
          
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_languages_limit: 12
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_ignored: "roff"

          plugin_languages_recent_load: 1000
          plugin_languages_recent_days: 0
          plugin_languages_categories: programming, markup, data

          plugin_languages_analysis_timeout: 60

          filename: github-languages.svg 
          committer_message: "chore: update languages metrics [skip ci]"
